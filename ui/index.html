<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codenotch</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" data-edge="right" data-expanded="false" data-visibility="onHover">
      <div id="edge-hotzone" aria-hidden="true"></div>
      <div id="stage">
        <div id="tooltip" hidden>
          <div class="tooltip-card">
            <div class="tooltip-header">
              <span class="tooltip-glyph"></span>
              <span class="tooltip-title">Usage</span>
            </div>
            <div class="tooltip-windows"></div>
          </div>
          <div class="tooltip-tail"></div>
        </div>

        <div id="notch-wrap">
          <svg id="notch-shape" viewBox="0 0 70 400" preserveAspectRatio="none" aria-hidden="true">
            <path id="notch-path" fill="#000"></path>
          </svg>
          <div id="cells"></div>
          <button id="orb" type="button" title="Settings" aria-label="Settings">
            <svg class="orb-gear" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#fff" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm9.4 2.6-1.7-.3a6.9 6.9 0 0 0-.6-1.4l1.1-1.3-1.8-1.8-1.3 1.1c-.4-.3-.9-.5-1.4-.6l-.3-1.7h-2.5l-.3 1.7c-.5.1-1 .3-1.4.6L9.9 5.3 8.1 7.1l1.1 1.3c-.3.4-.5.9-.6 1.4l-1.7.3v2.5l1.7.3c.1.5.3 1 .6 1.4L8.1 15.6l1.8 1.8 1.3-1.1c.4.3.9.5 1.4.6l.3 1.7h2.5l.3-1.7c.5-.1 1-.3 1.4-.6l1.3 1.1 1.8-1.8-1.1-1.3c.3-.4.5-.9.6-1.4l1.7-.3v-2.5ZM12 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <script src="./design.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
