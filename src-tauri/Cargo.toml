[package]
name = "codenotch"
version = "1.5.0"
description = "Linux port of Codenotch — coding-assistant usage notch"
authors = ["Codenotch Linux"]
edition = "2021"

[lib]
name = "codenotch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"], optional = true }

[features]
default = []
keyring = ["secret-service"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
